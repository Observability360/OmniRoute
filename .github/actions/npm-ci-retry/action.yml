name: npm ci with retry
description: Run npm ci with retries for transient registry/network failures.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        max_attempts=3
        delay_seconds=20

        for attempt in $(seq 1 "$max_attempts"); do
          if [ "$attempt" -gt 1 ]; then
            echo "npm ci attempt $attempt/$max_attempts after transient failure"
          fi

          if npm ci; then
            exit 0
          fi

          exit_code=$?
          if [ "$attempt" -eq "$max_attempts" ]; then
            exit "$exit_code"
          fi

          sleep "$delay_seconds"
          delay_seconds=$((delay_seconds * 2))
        done

    # TEMPORARY, broader than ideal: this should live only on ci.yml's `test-unit`
    # job (Azure MAI browser-audio regression tests spawn the real ffmpeg binary,
    # which GitHub's hosted image no longer guarantees), but this session's git
    # token lacks the `workflow` OAuth scope needed to push a .github/workflows/*
    # change, so every job using this shared action pays a cheap `command -v`
    # check instead. A human with that scope should move this into test-unit's
    # own steps in ci.yml and drop it from here.
    - name: Ensure ffmpeg is present (Azure MAI audio normalization tests)
      shell: bash
      run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
