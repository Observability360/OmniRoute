name: O360 one-off build (1fe18e5)

# One-off, never-merged build used to produce an immutable O360-owned image
# for release/v3.8.51 @ 1fe18e5206969749f331df5374f8199a61e080d4 (PR #7 merge:
# verified Cloudflare Access human identity). Deliberately separate from
# docker-publish.yml, which hardcodes the diegosouzapw/* upstream namespaces
# on both Docker Hub and GHCR — this workflow publishes ONLY to
# ghcr.io/observability360/omniroute, tagged with the immutable source SHA
# (no :latest), and never touches Docker Hub. Package stays PRIVATE this time
# (previous build flipped it public unintentionally via a follow-up step;
# this run intentionally omits that).
#
# push-trigger scoped to its own throwaway branch — workflow_dispatch
# requires the file to exist on the default branch, which this deliberately
# never touches. Fires exactly once (this push).

on:
  push:
    branches:
      - build/o360-web-image-1fe18e5

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & publish runner-web image (O360 org only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: 1fe18e5206969749f331df5374f8199a61e080d4
          persist-credentials: false

      - name: Verify exact source SHA
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED=1fe18e5206969749f331df5374f8199a61e080d4
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::checked out $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "BUILD_SOURCE_SHA=$ACTUAL" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (O360 org only)
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push O360-owned web image (immutable SHA tag only)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          push: true
          tags: ghcr.io/observability360/omniroute:${{ env.BUILD_SOURCE_SHA }}

      - name: Report result
        run: |
          echo "IMAGE_TAG=ghcr.io/observability360/omniroute:${{ env.BUILD_SOURCE_SHA }}"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "BUILD_SOURCE_SHA=${{ env.BUILD_SOURCE_SHA }}"

  verify:
    name: Verify published image (isolated, no production data)
    needs: build-and-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry (read)
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull by exact digest
        run: docker pull ghcr.io/observability360/omniroute@${{ needs.build-and-publish.outputs.digest }}

      - name: Confirm linux/amd64
        run: docker inspect ghcr.io/observability360/omniroute@${{ needs.build-and-publish.outputs.digest }} --format '{{.Os}}/{{.Architecture}}' | tee /tmp/platform.txt

      - name: Run container with isolated ephemeral data (no host volume, no production mount)
        run: |
          docker run -d --name verify \
            -p 20128:20128 \
            -e OMNIROUTE_MEMORY_MB=1024 \
            ghcr.io/observability360/omniroute@${{ needs.build-and-publish.outputs.digest }}
          for i in $(seq 1 30); do
            if docker inspect -f '{{.State.Health.Status}}' verify 2>/dev/null | grep -q healthy; then
              echo "HEALTHY after ${i}0s-ish"
              break
            fi
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' verify

      - name: Local health endpoint
        run: curl -sS -m 10 http://127.0.0.1:20128/api/monitoring/health | tee /tmp/health.json

      - name: Evidence — Cloudflare Access verification code present in built artifact
        run: |
          docker exec verify sh -c "grep -rl 'verifyCloudflareAccessAssertion\|Cf-Access-Jwt-Assertion\|cf-access-jwt-assertion' /app/.build/next/server /app/src 2>/dev/null" | tee /tmp/cf_access_evidence.txt || echo "NOT_FOUND_AS_PLAINTEXT" | tee /tmp/cf_access_evidence.txt

      - name: Evidence — workspace_identity subject kind present in built artifact
        run: |
          docker exec verify sh -c "grep -rl 'workspace_identity' /app/.build/next/server /app/src 2>/dev/null" | tee /tmp/workspace_identity_evidence.txt || echo "NOT_FOUND_AS_PLAINTEXT" | tee /tmp/workspace_identity_evidence.txt

      - name: Evidence — combo-config-audit code present in built artifact
        run: |
          docker exec verify sh -c "grep -rl 'combo\.create' /app/.next /app/.build 2>/dev/null" | tee /tmp/combo_evidence.txt || echo "NOT_FOUND_AS_PLAINTEXT" | tee /tmp/combo_evidence.txt

      - name: Evidence — issue #5 controller.terminate fix present in built artifact
        run: |
          docker exec verify sh -c "grep -rl 'controller\.terminate' /app/open-sse /app/.build/next/server 2>/dev/null" | tee /tmp/terminate_evidence.txt || echo "NOT_FOUND_AS_PLAINTEXT" | tee /tmp/terminate_evidence.txt

      - name: Container logs (on failure diagnostics)
        if: always()
        run: docker logs verify --tail 100 || true

      - name: Cleanup verify container
        if: always()
        run: docker rm -f verify || true
