name: O360 one-off build (3ae5157b)

# One-off, never-merged build used to produce an immutable O360-owned image
# for release/v3.8.51 @ 3ae5157bbee2579bbaa8a5ab3af21c8227e136cb. Deliberately
# separate from docker-publish.yml, which hardcodes the diegosouzapw/*
# upstream namespaces on both Docker Hub and GHCR — this workflow publishes
# ONLY to ghcr.io/observability360/omniroute, tagged with the immutable
# source SHA (no :latest), and never touches Docker Hub.
#
# workflow_dispatch requires the workflow file to exist on the repo's
# default branch to even be dispatchable — this file deliberately never
# touches main, so it triggers on push to its own throwaway branch instead.
# That branch is never merged, so this fires exactly once (this push) and
# never again.

on:
  push:
    branches:
      - build/o360-web-image-3ae5157b

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & publish runner-web image (O360 org only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v7
        with:
          ref: 3ae5157bbee2579bbaa8a5ab3af21c8227e136cb
          persist-credentials: false

      - name: Verify exact source SHA
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED=3ae5157bbee2579bbaa8a5ab3af21c8227e136cb
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::checked out $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "BUILD_SOURCE_SHA=$ACTUAL" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (O360 org only)
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push O360-owned web image (immutable SHA tag only)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: linux/amd64
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          push: true
          tags: ghcr.io/observability360/omniroute:${{ env.BUILD_SOURCE_SHA }}

      - name: Report result
        run: |
          echo "IMAGE_TAG=ghcr.io/observability360/omniroute:${{ env.BUILD_SOURCE_SHA }}"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "BUILD_SOURCE_SHA=${{ env.BUILD_SOURCE_SHA }}"
