name: o360-omni-image
# O360 production image build: pushes linux/amd64 to GHCR on demand.
# Exists because docker-publish.yml targets Docker Hub with credentials
# this repo does not have (failing on every main push since 2026-09-10).
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: vinhali
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/observability360/omniroute:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
